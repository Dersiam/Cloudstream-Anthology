name: Build Plugins

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds
        continue-on-error: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Plugins
        run: |
          cd main
          gradle makePluginsJson --stacktrace

      - name: Deploy to builds branch
        run: |
          mkdir -p deploy
          find main -name "*.cs3" -exec cp -v {} deploy/ \;
          cp -fv main/build/plugins.json deploy/ 2>/dev/null || true
          cp -fv main/repo.json deploy/ 2>/dev/null || true
          cd deploy
          echo "=== Total CS3 files built: ==="
          ls -1 *.cs3 2>/dev/null | wc -l
          echo "=== Files in deploy directory: ==="
          ls -lh
          git init
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-build plugins with cs3 binaries [skip ci]" || exit 0
          git push -f https://${{ github.token }}@github.com/${{ github.repository }}.git HEAD:builds
