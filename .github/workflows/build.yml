name: Build Plugins

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds
        continue-on-error: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Plugins
        run: |
          cd main
          gradle makePluginsJson --stacktrace

      - name: Deploy to builds branch
        run: |
          mkdir -p builds
          cp -r main/build/* builds/ 2>/dev/null || true
          cp -r main/*.json builds/ 2>/dev/null || true
          cd builds
          git init
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-build plugins [skip ci]" || exit 0
          git push -f https://${{ github.token }}@github.com/${{ github.repository }}.git HEAD:builds
